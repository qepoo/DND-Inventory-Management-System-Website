<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="src/css/styles.css">
        
        <title>Inventory Management System</title>
        <script type="module" src="src/main.js"></script>
    </head>
    
    <body>
        <h2>Inventory Management System</h2>

        <table class="w-75" id="inventory-table">
            <thead>
                <tr>
                    <th>Icon</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Weight</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <button id="newRowBtn" class="p-1 mt-3 btn btn-success btn-lg" title="Create New Row">Create new item</button>
        
            <div id="newRowModal" class="modal modal-centered">
                <div class="modal-content w-50">
                    <span id="close-modal-btn" class="close">&times;</span>
                    <form id="new-row-form">    <!-- action="[URL]" sends data to selected url-->
                        <h3>New item form</h3>

                        <div class="flex-container">
                            <div class="input-zone flex-container">
                                <div class="input-labels flex-container">
                                    <div>
                                        <span class="required-field-star">*</span>
                                        <label for="fname">Item name: </label>
                                    </div>
                                    <label for="fdescription">Description: </label>
                                    <label for="fweight">Weight: </label>
                                    <label for="fprice">Price: </label>
                                </div>
                                <div class="input-fields flex-container">
                                    <input type="text" id="modal-name" required/>
                                    <input type="text" id="modal-description"/>
                                    <input type="text" id="modal-weight"/>
                                    <input type="text" id="modal-price"/>
                                </div>
                            </div>
